  html,body{margin:0;padding:0;background:#000;}
  body{width:600px;height:600px;overflow:hidden;position:relative;
       font-family:"Source Sans 3",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}

  /* Safe inset 6 %: an ASSUMPTION carried from the bench. Meta publishes no figure. */
  #stage{position:absolute;left:36px;right:36px;bottom:36px;top:36px;
         display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;}

  /* The single focusable element. It is always focused, so the required indicator is a faint
     hairline along the bottom edge rather than the docs' cyan glow, which would sit on top of the
     design under test. */
  /* No visible focus indicator. There is one focusable element and it is always focused; the
     hairline that used to sit here showed up on the real lens as a stray 1 px line (glasses-65). */
  #stage:focus{outline:none;}

  #block{display:flex;flex-direction:column;align-items:flex-start;gap:12px;opacity:1;
         transform:translateY(0);transition:opacity 500ms linear, transform 500ms cubic-bezier(.2,.7,.2,1);}
  #block.out{opacity:0;}

  /* The plate wraps the English ONLY. Radius 15, padding 17/13, hugs its longest line.
     Treatment fixed at Chad's vertical fade, 90 % at the top to 35 % at the bottom (glasses-68). */
  #plate{border-radius:15px;padding:13px 17px;max-width:100%;box-sizing:border-box;
         transition:box-shadow 600ms ease-out, opacity 300ms linear;}
  body[data-plate="vfade"] #plate{
         background:linear-gradient(to bottom, rgba(255,255,255,.90) 0%, rgba(255,255,255,.35) 100%);}
  /* Chad's revised inner-glow bubble (glasses-71): 40 % fill, inner glow eased to 75 %, no stroke,
     English at 80 % white. */
  body[data-plate="inner"] #plate{
         background:rgba(255,255,255,.40);
         box-shadow:inset 0 0 18px 4px rgba(255,255,255,.75);}
  body[data-plate="inner"] #en{color:rgba(255,255,255,.80);}
  /* Chad's colour alternate (glasses-71): pale blue-white text on a blue fill that darkens toward
     its edges under a navy inner glow. First non-white light on the lens. Luminance for the record:
     text ~214, fill ~89, glow ~30 of 255 -- the fill emits about as much light as the 40 % white one. */
  body[data-plate="blue"] #plate{
         background:rgb(30,95,200);
         box-shadow:inset 0 0 18px 4px rgb(10,30,75);}
  body[data-plate="blue"] #en{color:rgb(204,215,230);}
  /* Chad's indigo alternate (glasses-72): dimmer than the blue in every part.
     Luminance ~177 text, ~56 fill, ~18 glow. */
  body[data-plate="indigo"] #plate{
         background:rgb(50,50,130);
         box-shadow:inset 0 0 18px 4px rgb(10,15,70);}
  body[data-plate="indigo"] #en{color:rgb(175,175,200);}
  body[data-plate="solid"] #plate{background:#fff;}
  #en{font-family:"Source Sans 3",system-ui,sans-serif;font-weight:700;font-size:32px;
      line-height:1.22;color:#000;letter-spacing:-.012em;}

  /* ---- Effects showcase (glasses-68). Each carries information a live caption needs. ---- */
  #en .w{opacity:0;transition:opacity 180ms linear;}
  #en .w.on{opacity:1;}
  #block.provisional #plate{opacity:.55;}
  #en .doubt{opacity:.55;text-decoration:underline dotted;text-underline-offset:5px;text-decoration-thickness:2px;}
  body[data-plate="inner"] #en .doubt, body[data-plate="blue"] #en .doubt, body[data-plate="indigo"] #en .doubt{opacity:.6;}
  #block.arrive #plate{box-shadow:0 0 26px 8px rgba(255,255,255,.42);}
  body[data-plate="inner"] #block.arrive #plate{box-shadow:inset 0 0 18px 4px rgba(255,255,255,.75), 0 0 26px 8px rgba(255,255,255,.42);}
  body[data-plate="blue"]  #block.arrive #plate{box-shadow:inset 0 0 18px 4px rgb(10,30,75), 0 0 26px 8px rgba(120,170,255,.45);}
  body[data-plate="indigo"] #block.arrive #plate{box-shadow:inset 0 0 18px 4px rgb(10,15,70), 0 0 26px 8px rgba(150,150,230,.45);}
  #block.aging{transition:opacity 6000ms linear;}
  #block.aged{opacity:.38;}

  /* Georgian OUTSIDE the plate, on bare glass, at a share of full white. */
  #ka{font-family:"Noto Sans Georgian",Sylfaen,serif;font-weight:400;font-size:22px;
      line-height:1.34;color:rgba(255,255,255,.75);max-width:100%;}

  /* Build tag: confirms the right build loaded during first light. 16 px is Meta's stated minimum. */
  #tag{position:absolute;right:36px;top:36px;font-size:16px;color:rgba(255,255,255,.35);
       font-family:"Source Sans 3",system-ui,sans-serif;font-weight:700;letter-spacing:.04em;}
  #hud{position:absolute;left:36px;top:36px;right:210px;font-size:16px;color:rgba(255,255,255,.55);
       font-family:"Source Sans 3",system-ui,sans-serif;font-weight:700;opacity:0;
       transition:opacity 200ms linear;}
  #hud.show{opacity:1;}
</style>
</head>
<body>
  <div id="tag">LensBridge 0.4.4</div>
  <div id="hud"></div>
  <div id="stage" class="focusable" tabindex="0" role="application" aria-label="LensBridge">
    <div id="block">
      <div id="plate"><div id="en"></div></div>
      <div id="ka"></div>
    </div>
  </div>
<script>
  var UTTS = [
    {e:"Hello, how are you?",                                                     k:"გამარჯობა, როგორ ხართ?"},
    {e:"Could you repeat that, please?",                                          k:"შეგიძლიათ გაიმეოროთ, თუ შეიძლება?"},
    {e:"Sorry, I don't understand. Could you say it more slowly?",                k:"ბოდიში, მე ეს არ მესმის — შეგიძლიათ უფრო ნელა თქვათ?"},
    {e:"We'll meet tomorrow morning at nine o'clock near the hotel, if that works for you.",
                                                                                  k:"ხვალ დილით ცხრა საათზე შევხვდებით სასტუმროსთან, თუ ეს თქვენთვის მოსახერხებელია."}
  ];
  // Pinch cycles these. Every one answers a real caption question, not a cosmetic one.
  var EFFECTS = [
    {id:"fade",      note:"plain crossfade, 500 ms each way"},
    {id:"reveal",    note:"words lit as they commit"},
    {id:"pulse",     note:"arrives provisional, brightens on commit"},
    {id:"uncertain", note:"one low-confidence word dimmed and dotted"},
    {id:"glow",      note:"soft halo on arrival, decays"},
    {id:"age",       note:"dims over 6 s of silence, then clears"}
  ];
  var i = 1, kaBright = 75, busy = false, fx = 0, ageTimer = null, clearTimer = null;
  var PLATES = ["inner","blue","indigo","vfade","solid"], plateIdx = 0;
  function setPlate(n){ plateIdx = (n + PLATES.length) % PLATES.length;
                        document.body.dataset.plate = PLATES[plateIdx]; flash("plate: " + PLATES[plateIdx]); }
  var block = document.getElementById("block"), en = document.getElementById("en"),
      ka = document.getElementById("ka"), stage = document.getElementById("stage"),
      hud = document.getElementById("hud");

  function paint(){
    var words = UTTS[i].e.split(" ");
    var doubt = EFFECTS[fx].id === "uncertain" ? Math.floor(Math.random() * words.length) : -1;
    var reveal = EFFECTS[fx].id === "reveal";
    en.innerHTML = words.map(function(w, n){
      var cls = (reveal ? "w" : "") + (n === doubt ? " doubt" : "");
      return '<span class="' + cls.trim() + '">' + w + '</span>';
    }).join(" ");
    ka.textContent = UTTS[i].k;
    ka.style.color = "rgba(255,255,255," + (kaBright/100).toFixed(2) + ")";
  }
  function resetState(){
    clearTimeout(ageTimer); clearTimeout(clearTimer);
    block.className = "";
  }
  // Replace, never reflow. The next line is laid out while invisible; nothing on the lens re-wraps.
  function show(next){
    if (busy) return; busy = true;
    var id = EFFECTS[fx].id;
    resetState();
    block.classList.add("out");
    setTimeout(function(){
      i = (next + UTTS.length) % UTTS.length; paint();
      if (id === "pulse") block.classList.add("provisional");
      if (id === "glow")  block.classList.add("arrive");
      block.classList.remove("out");
      if (id === "reveal") {
        var ws = en.querySelectorAll(".w");
        ws.forEach(function(w, n){ setTimeout(function(){ w.classList.add("on"); }, 90 + n * 110); });
      }
      if (id === "pulse") {
        setTimeout(function(){ block.classList.remove("provisional"); block.classList.add("arrive");
                               setTimeout(function(){ block.classList.remove("arrive"); }, 260); }, 700);
      }
      if (id === "glow") setTimeout(function(){ block.classList.remove("arrive"); }, 120);
      if (id === "age") {
        ageTimer   = setTimeout(function(){ block.classList.add("aging"); block.classList.add("aged"); }, 800);
        clearTimer = setTimeout(function(){ block.classList.add("out"); }, 7200);
      }
      busy = false;
    }, 500);
  }
  var hudTimer = null;
  function flash(msg){
    hud.textContent = msg; hud.classList.add("show");
    clearTimeout(hudTimer); hudTimer = setTimeout(function(){ hud.classList.remove("show"); }, 1400);
  }
  document.addEventListener("keydown", function(e){
    switch (e.key) {
      case "ArrowRight": show(i + 1); break;
      case "ArrowLeft":  show(i - 1); break;
      case "Enter":      fx = (fx + 1) % EFFECTS.length; flash(EFFECTS[fx].id + " — " + EFFECTS[fx].note); break;
      case "ArrowUp":    setPlate(plateIdx + 1); break;
      case "ArrowDown":  setPlate(plateIdx - 1); break;
      default: return;
    }
    e.preventDefault();
  });
  document.body.dataset.plate = PLATES[0];
  paint();
  stage.focus();
</script>
</body>
</html>
